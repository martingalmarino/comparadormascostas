name: Actualizar precios

on:
  schedule:
    # Lunes 09:00 ART (UTC-3)
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  precios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run update-prices
      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Marcar precios que requieren revisión"
          title: "Precios: requiere revisión"
          body-path: scripts/out/reporte.md
          branch: bot/precios
          add-paths: |
            data/planes
            data/historial
